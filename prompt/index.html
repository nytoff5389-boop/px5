<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HUMnoi Prompt</title>
<meta name="description" content="ดาวน์โหลด prompt สร้างโครงกระดูก 3D และระบบปักหมุดชี้ส่วนกระดูก">
<style>
:root{--bg:#0b0b0d;--card:#141417;--line:#2a2a30;--tx:#ececee;--tx2:#a2a2aa;--ac:#ff9f43}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Sukhumvit Set","IBM Plex Sans Thai",system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) 16px 32px}
main{max-width:720px;margin:0 auto}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.01em}h1 span{color:var(--ac)}
p.sub{color:var(--tx2);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
a.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:0;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.primary{background:var(--ac);color:#1a1006;flex:1}
.ghost{background:#1d1d21;color:var(--tx);border:1px solid var(--line)!important}
.meta{font-size:13px;color:var(--tx2);margin-bottom:10px}
pre{white-space:pre-wrap;word-break:break-word;margin:0;max-height:55dvh;overflow:auto;background:#0e0e10;border:1px solid var(--line);border-radius:10px;padding:14px;font:14px/1.7 -apple-system,"Sukhumvit Set",system-ui,sans-serif;color:#d6d6da}
#ok{color:var(--ac);font-size:14px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>HUM<span>noi</span> · Prompt</h1>
<p class="sub">Prompt สร้างโครงกระดูกมนุษย์ 3D และระบบปักหมุดชี้ส่วนกระดูก (ไฟล์ .md)</p>
<div class="card">
<div class="row">
<a class="btn primary" id="dl" href="HUMnoi_bone_pin_prompt.md" download="HUMnoi_bone_pin_prompt.md">⬇ ดาวน์โหลดไฟล์ .md</a>
<button class="btn ghost" id="cp">คัดลอกข้อความ</button>
</div>
<div class="meta" id="meta">กำลังโหลด…</div>
<pre id="txt"></pre>
<div id="ok"></div>
</div>
</main>
<script>
var URL_MD='HUMnoi_bone_pin_prompt.md',text='';
fetch(URL_MD,{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){text=t;document.getElementById('txt').textContent=t;document.getElementById('meta').textContent=t.length.toLocaleString()+' ตัวอักษร · UTF-8';}).catch(function(){document.getElementById('meta').textContent='โหลดตัวอย่างไม่สำเร็จ — กดดาวน์โหลดได้เลย';});
document.getElementById('dl').addEventListener('click',function(e){if(!text)return;e.preventDefault();var b=new Blob([text],{type:'text/markdown;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='HUMnoi_bone_pin_prompt.md';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1000);document.getElementById('ok').textContent='เริ่มดาวน์โหลดแล้ว (iPhone/iPad: ดูในแอป ไฟล์ › ดาวน์โหลด)';});
document.getElementById('cp').addEventListener('click',function(){if(!text)return;navigator.clipboard.writeText(text).then(function(){document.getElementById('ok').textContent='คัดลอกแล้ว';},function(){document.getElementById('ok').textContent='คัดลอกไม่ได้ ให้กดดาวน์โหลดแทน';});});
</script>
</body>
</html>
