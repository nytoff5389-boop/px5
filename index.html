<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PX5</title>
<meta name="description" content="PX5 แพลตฟอร์มรวมแอพทบทวนบทเรียน Anatomy และ calc">
<meta name="theme-color" content="#000000">
<link rel="icon" href="px5/img/icon.png"><link rel="apple-touch-icon" href="px5/img/icon.png">
<link rel="stylesheet" href="px5/fonts.css?v=2">
<link rel="preload" as="image" href="px5/img/anatomy-key.webp"><link rel="preload" as="image" href="px5/img/calc-key.webp">
<style>
:root{--ink:#fff;--ink-2:rgba(255,255,255,.78);--muted:rgba(255,255,255,.55);--acc:#FF6B3D;
  --f:'PX Latin','PX Thai',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark}
body[data-sel="calc"]{--acc:#2FD9F0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;left:0;top:0;width:calc(var(--u)*100);height:calc(var(--v)*100);overflow:hidden;transform-origin:0 0;background:#000}
body{color:var(--ink);font:500 16px/1.55 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}

/* ---------- ภาพพื้นหลังของแอพที่เลือก ---------- */
.bg{position:absolute;inset:0;z-index:0;background:#05070a}
.bg i{position:absolute;inset:-2% -2% -36% -2%;background-size:cover;background-position:50% 0;opacity:0;transform:scale(1.06);transition:opacity .9s ease,transform 7s ease-out}
.bg i.on{opacity:1;transform:scale(1)}
.bg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.12) 22%,rgba(0,0,0,.05) 45%,rgba(0,0,0,.72) 78%,rgba(0,0,0,.94) 100%),
  linear-gradient(90deg,rgba(0,0,0,.55) 0%,transparent 55%)}
#fx{position:absolute;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}

/* ---------- โครงหน้าโฮม ---------- */
.home{position:relative;z-index:2;height:calc(var(--v)*100);display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) 0 max(18px,env(safe-area-inset-bottom));opacity:0}
.home.in{opacity:1;transition:opacity .9s ease}
.home.in .tabs,.home.in .info,.home.in .rail,.home.in .hints{animation:rise .8s var(--ease) backwards}
.home.in .info{animation-delay:.12s}.home.in .rail{animation-delay:.2s}.home.in .hints{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.pad{padding-left:clamp(18px,calc(var(--u)*6.6),136px);padding-right:clamp(18px,calc(var(--u)*3.4),64px)}
.top{display:flex;align-items:center;gap:14px;padding-left:clamp(18px,calc(var(--u)*2.4),48px)}
.clock{font:500 clamp(15px,calc(var(--u)*1.3),20px)/1 var(--f);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.net{width:18px;height:18px;opacity:.9}
.sp{flex:1}
.tbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:background .15s}
.tbtn svg{width:20px;height:20px}
.tbtn:hover{background:rgba(255,255,255,.14)}
.logo img{height:26px;width:auto;display:block}

.tabs{display:flex;align-items:center;gap:6px;margin-top:clamp(18px,calc(var(--v)*5.5),62px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.lr{flex:none;font:700 10px/1 var(--f);letter-spacing:.04em;color:var(--muted);border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 8px;margin:0 8px 0 0}
.lr.r{margin:0 0 0 8px}
.tab{flex:none;font:800 clamp(13px,calc(var(--u)*1.05),17px)/1 var(--f);letter-spacing:.09em;text-transform:uppercase;color:#fff;padding:9px 13px;border-radius:999px;border:2.5px solid transparent;transition:border-color .2s,background .2s}
.tab.on{border-color:#2F7BFF;box-shadow:0 0 0 1px rgba(47,123,255,.35),0 0 18px rgba(47,123,255,.45)}

.mid{flex:1;min-height:0;display:flex;align-items:flex-end}
.info{max-width:min(560px,calc(var(--u)*92));padding-bottom:clamp(14px,calc(var(--v)*3),30px)}
.eyebrow{font:700 12px/1 var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--acc);text-shadow:0 0 18px var(--acc)}
.name{font:800 clamp(34px,calc(var(--u)*4.6),64px)/1 var(--f);letter-spacing:.04em;text-transform:uppercase;margin:12px 0 0;text-shadow:0 2px 30px rgba(0,0,0,.8)}
.name small{display:block;font:600 clamp(12px,calc(var(--u)*1.1),16px)/1 var(--f);letter-spacing:.34em;color:var(--ink-2);margin-top:10px}
.desc{margin:14px 0 0;color:var(--ink-2);font-weight:400;font-size:clamp(14px,calc(var(--u)*1.1),16.5px);text-shadow:0 1px 12px rgba(0,0,0,.9)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);background:rgba(10,12,16,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.play{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:210px;height:54px;margin-top:20px;padding:0 34px;border-radius:999px;background:#fff;color:#000;font:700 17px/1 var(--f);letter-spacing:.02em;
  box-shadow:0 0 0 0 rgba(255,255,255,.0);transition:transform .12s ease-out,box-shadow .2s}
.play:hover,.play:focus-visible{box-shadow:0 0 0 3px rgba(0,0,0,.6),0 0 0 6px #fff,0 0 34px rgba(255,255,255,.55)}
.swap{animation:swap .55s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateX(-14px)}}

/* ---------- แถวไทล์ ---------- */
.rail{display:flex;align-items:flex-end;gap:clamp(12px,calc(var(--u)*1.25),24px);height:calc(var(--big) + 22px);padding-top:10px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none;--sm:clamp(92px,calc(var(--u)*11),214px);--big:clamp(118px,calc(var(--u)*13.4),262px)}
.rail::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;width:var(--sm);height:var(--sm);border-radius:3px;background:#12151b center/cover;transition:width .28s var(--ease),height .28s var(--ease),transform .12s ease-out,filter .3s,opacity .3s;filter:brightness(.82)}
.tile.on{width:var(--big);height:var(--big);filter:none;box-shadow:0 0 0 3px #000,0 0 0 6px #fff,0 0 40px rgba(255,255,255,.35),0 24px 50px rgba(0,0,0,.7);animation:focus 2.6s ease-in-out infinite}
@keyframes focus{50%{box-shadow:0 0 0 3px #000,0 0 0 6px rgba(255,255,255,.72),0 0 22px rgba(255,255,255,.16),0 24px 50px rgba(0,0,0,.7)}}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);background-size:260% 100%;background-position:120% 0;opacity:0;pointer-events:none}
.tile.on::after{animation:sheen 1.1s .15s ease-out}
@keyframes sheen{0%{opacity:.9;background-position:120% 0}100%{opacity:0;background-position:-60% 0}}
.tile.hide{display:none}
.tile.soon{display:grid;place-items:center;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--muted);font:700 11px/1.4 var(--f);letter-spacing:.14em;text-align:center;cursor:default;filter:none}
.tile.soon svg{width:28px;height:28px;display:block;margin:0 auto 8px}
/* กดไทล์/ปุ่ม: ยุบลง วาบขาว แล้วเด้งกลับ */
.pressing{transform:scale(.94)!important;transition:transform .07s ease-out!important}
.fire{animation:fire .42s var(--ease)!important}
@keyframes fire{0%{transform:scale(.94);filter:brightness(2.4)}45%{transform:scale(1.045);filter:brightness(1.35)}100%{transform:scale(1);filter:none}}
.under{display:flex;align-items:center;gap:10px;height:26px;margin-top:2px;font:700 12px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.under img{height:11px;opacity:.85}
.hints{position:absolute;right:clamp(18px,calc(var(--u)*5.6),116px);bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:26px;font:800 13px/1 var(--f);letter-spacing:.12em;text-transform:uppercase}
.hints span{display:inline-flex;align-items:center;gap:9px}
.hints svg{width:24px;height:24px}
html.short .home{padding-top:14px;padding-bottom:10px}
html.short .tabs{margin-top:8px}
html.short .tab{padding:7px 11px;font-size:12px}
html.short .eyebrow,html.short .desc,html.short .chips{display:none}
html.short .info{display:flex;align-items:flex-end;gap:22px;max-width:none;padding-bottom:10px}
html.short .name{font-size:28px;margin:0}
html.short .name small{font-size:10.5px;margin-top:7px}
html.short .play{height:42px;min-width:150px;margin:0;font-size:15px}
html.short .rail{--sm:96px;--big:118px;padding-bottom:8px}
html.short .under{height:20px}
html.short .hints{font-size:11px;gap:18px;bottom:12px}
html.short .hints svg{width:20px;height:20px}
html.short .logo img{height:20px}
html.narrow .hints span:not(:last-child){display:none}
html.rot .pad{padding-left:max(calc(var(--u)*6.6),calc(env(safe-area-inset-top) + 14px))}
html.rot .top{padding-left:max(18px,calc(env(safe-area-inset-top) + 6px))}
/* ---------- ฉากบูต ---------- */
#boot{position:absolute;inset:0;z-index:60;background:#000;display:grid;place-items:center;transition:opacity .9s ease}
#boot.out{opacity:0;pointer-events:none}
#boot canvas{position:absolute;inset:0;width:100%;height:100%}
#boot img{position:relative;width:min(calc(var(--u)*46),300px);opacity:0;animation:blogo 2.1s ease forwards}
@keyframes blogo{25%{opacity:1}70%{opacity:1}100%{opacity:0}}
#boot .skip{position:absolute;right:22px;bottom:max(20px,env(safe-area-inset-bottom));font:600 12px/1 var(--f);letter-spacing:.14em;color:rgba(255,255,255,.5);text-transform:uppercase}
#boot .press{position:absolute;left:0;right:0;bottom:18%;text-align:center;font:500 15px/1 var(--f);letter-spacing:.08em;color:#fff;opacity:0;transition:opacity .8s}
#boot .press.on{opacity:1;animation:blink 2.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* ---------- หน้าโหลดเข้าแอพ ---------- */
#launch{position:absolute;inset:0;z-index:50;background:#000;opacity:0;pointer-events:none;transition:opacity .45s ease;overflow:hidden}
#launch.on{opacity:1;pointer-events:auto}
#launch .art{position:absolute;inset:0;background:center/contain no-repeat;opacity:0;transform:scale(1.14);filter:blur(10px) brightness(1.6)}
#launch.show .art{opacity:1;transform:scale(1);filter:none;transition:opacity 1s ease .1s,transform 2.6s cubic-bezier(.1,.7,.2,1) .1s,filter 1.1s ease .1s}
#launch canvas{position:absolute;inset:0;width:100%;height:100%}
#launch .ld{position:absolute;right:clamp(20px,calc(var(--u)*4),60px);bottom:max(24px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;font:600 12px/1 var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);opacity:0;transition:opacity .5s .6s}
#launch.show .ld{opacity:1}
.ring{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#launch .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,transparent,var(--acc),#fff);box-shadow:0 0 18px var(--acc)}
#launch.show .bar{width:100%;transition:width 2.5s cubic-bezier(.3,.1,.2,1) .2s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body data-sel="anatomy">
<div id="stage">
<div class="bg" aria-hidden="true"><i data-for="anatomy" style="background-image:url(px5/img/anatomy-key.webp)"></i><i data-for="calc" style="background-image:url(px5/img/calc-key.webp)"></i></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="home" id="home">
  <header class="top">
    <span class="clock" id="clock">--:--</span>
    <svg class="net" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3.5 9.5a12.5 12.5 0 0 1 17 0M6.8 13a8 8 0 0 1 10.4 0M9.9 16.4a3.6 3.6 0 0 1 4.2 0"/><circle cx="12" cy="19.4" r="1" fill="currentColor"/></svg>
    <span class="sp"></span>
    <button class="tbtn" id="snd" aria-label="เปิดหรือปิดเสียง"></button>
    <button class="tbtn" id="full" aria-label="เต็มจอ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg></button>
    <span class="logo pad" style="padding-left:6px"><img src="px5/img/px5-logo.png" alt="PX5"></span>
  </header>

  <nav class="tabs pad" id="tabs" aria-label="หมวดหมู่">
    <span class="lr">L1</span>
    <button class="tab on" data-cat="all">All</button>
    <button class="tab" data-cat="med">Medical Science</button>
    <button class="tab" data-cat="pharm">Pharmacy</button>
    <span class="lr r">R1</span>
  </nav>

  <div class="mid pad"><section class="info" id="info" aria-live="polite"></section></div>

  <nav class="rail pad" id="rail" aria-label="เลือกแอพ">
    <button class="tile" data-app="anatomy" data-cat="med" aria-label="Anatomy" style="background-image:url(px5/img/anatomy-cover.webp)"></button>
    <button class="tile" data-app="calc" data-cat="pharm" aria-label="calc" style="background-image:url(px5/img/calc-cover.webp)"></button>
    <div class="tile soon" data-cat="all"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>COMING<br>SOON</span></div>
  </nav>
  <div class="under pad"><img src="px5/img/px5-logo.png" alt=""><span id="under"></span></div>

  <div class="hints" aria-hidden="true">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 7l4.5 8h-9z" stroke-linejoin="round"/></svg>Full screen</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><rect x="7.8" y="7.8" width="8.4" height="8.4"/></svg>Sound</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 8l8 8M16 8l-8 8"/></svg>Play</span>
  </div>
</div>

<div id="launch" aria-hidden="true"><div class="art" id="lart"></div><canvas id="lfx"></canvas><div class="ld"><span id="ltxt">Loading</span><i class="ring"></i></div><i class="bar"></i></div>
<div id="boot"><canvas id="bfx"></canvas><img src="px5/img/px5-logo.png" alt="PX5"><p class="press" id="press">แตะหน้าจอ หรือกดปุ่มใดก็ได้</p><span class="skip">Skip</span></div>

</div>
<script>
(function(){
'use strict';
/* บังคับแนวนอน: ถ้าจอเป็นแนวตั้งให้หมุนทั้งเวที 90 องศา และคิดขนาดจากด้านยาว */
(function(){var R=document.documentElement,st=document.getElementById('stage');
  function fit(){var w=innerWidth,h=innerHeight,rot=h>w,W=rot?h:w,H=rot?w:h;R.style.setProperty('--u',W/100+'px');R.style.setProperty('--v',H/100+'px');
    st.style.transform=rot?'translateX('+w+'px) rotate(90deg)':'';R.classList.toggle('rot',rot);R.classList.toggle('short',H<=560);R.classList.toggle('narrow',W<=820);}
  fit();addEventListener('resize',fit);addEventListener('orientationchange',function(){setTimeout(fit,250);});})();
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
var $=function(s){return document.querySelector(s);}, $$=function(s){return [].slice.call(document.querySelectorAll(s));};
function read(k){try{return JSON.parse(localStorage.getItem(k))||{};}catch(e){return {};}}
var APPS={
  anatomy:{href:'anatomy/',cat:'med',k:'Human Anatomy · BI112',t:'Anatomy',s:'The Human Labyrinth',col:[255,120,50],
    d:'ทบทวนกายวิภาคศาสตร์บทที่ 1 ถึง 7 โจทย์ไม่รู้จบสามระดับ พร้อมเฉลยละเอียด และหนังสือสรุปทุกหน้า',
    stats:function(){var s=read('anatomeow.v1'),a=s.answered||0,c=s.correct||0;return [['ทำแล้ว',a+' ข้อ'],['แม่นยำ',a?Math.round(c/a*100)+'%':'–'],['เนื้อหา','7 บท']];}},
  calc:{href:'calc/',cat:'pharm',k:'Pharmaceutical Calculation · PHT111',t:'calc',s:'The Infinite',col:[60,215,240],
    d:'สรุปการคำนวณทางเภสัชกรรม เลขโรมันและเลขนัยสำคัญ ฝึกโจทย์แบบพิมพ์ตอบและช้อยส์ พร้อมหลักการคิดทุกข้อ',
    stats:function(){var s=read('jinoon.v1'),q=s.qz||{};return [['อ่านถึงหน้า',(s.bookPage||1)+' / 16'],['ทำโจทย์',(q.all||q.answered||0)+' ข้อ'],['เนื้อหา','บทที่ 1']];}}
};

/* ---------- เสียงระบบ (สังเคราะห์สด) ---------- */
var SND=(function(){var on=true,ctx=null;try{on=localStorage.getItem('px5.sound')!=='0';}catch(e){}

    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);

    var s=c.createBufferSource();s.buffer=n;var f=c.createBiquadFilter();f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(180,t);f.frequency.exponentialRampToValueAtTime(2600,t+d*.6);f.frequency.exponentialRampToValueAtTime(300,t+d);
    var g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.45);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(c.destination);s.start(t);}
  return {get on(){return on;},toggle:function(){on=!on;try{localStorage.setItem('px5.sound',on?'1':'0');}catch(e){} if(on)this.move();return on;},unlock:ac,
    move:function(){tone(1500,1100,.05,.05);},
    tab:function(){tone(900,1250,.07,.045);},
    ok:function(){tone(520,1040,.14,.09);tone(1040,1560,.22,.06,'sine',.07);tone(70,38,.5,.22,'sine',.02);whoosh(1.5,.1);},
    boot:function(){[130.8,196,261.6,392].forEach(function(f,i){tone(f,f*1.004,4.2,.035,'sine',i*.25);});whoosh(3.2,.05);}};})();

/* ---------- อนุภาค ---------- */
function Fx(cv){var c=cv.getContext('2d'),W=0,H=0,D=Math.min(devicePixelRatio||1,2),P=[],self=this;this.col=[255,120,50];this.rate=.35;this.run=false;this.mode='ember';
  function size(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0);} size();addEventListener('resize',size);
  this.burst=function(n,x,y,sp){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=(Math.random()*.8+.2)*(sp||6);P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,r:Math.random()*2+.6,l:1,d:.012+Math.random()*.02});}};
  function spawn(){var e=self.mode==='ember';P.push({x:Math.random()*W,y:e?H+8:-8,vx:(Math.random()-.5)*.5,vy:e?-(Math.random()*1.3+.4):(Math.random()*.7+.25),r:Math.random()*1.9+.5,l:1,d:.003+Math.random()*.005,w:Math.random()*6.28});}
  var acc=0;function frame(){if(!self.run)return;c.clearRect(0,0,W,H);c.globalCompositeOperation='lighter';acc+=self.rate;while(acc>1){acc--;if(P.length<260)spawn();}
    var k=self.col;for(var i=P.length-1;i>=0;i--){var p=P[i];p.w=(p.w||0)+.05;p.x+=p.vx+Math.sin(p.w)*.35;p.y+=p.vy;p.vx*=.992;p.vy*=.996;p.l-=p.d;if(p.l<=0||p.y<-20||p.y>H+20){P.splice(i,1);continue;}
      var g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);g.addColorStop(0,'rgba(255,255,255,'+(.9*p.l)+')');g.addColorStop(.25,'rgba('+k[0]+','+k[1]+','+k[2]+','+(.65*p.l)+')');g.addColorStop(1,'rgba('+k[0]+','+k[1]+','+k[2]+',0)');
      c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r*5,0,6.283);c.fill();}
    requestAnimationFrame(frame);}
  this.start=function(){if(RM||self.run)return;self.run=true;frame();};this.stop=function(){self.run=false;c.clearRect(0,0,W,H);};}
var fx=new Fx($('#fx')), lfx=new Fx($('#lfx'));

/* ---------- หน้าโฮม ---------- */
var tiles=$$('.tile[data-app]'), info=$('#info'), sel='anatomy', cat='all', busy=false;
try{var last=localStorage.getItem('px5.last');if(APPS[last])sel=last;}catch(e){}
function visible(){return tiles.filter(function(t){return !t.classList.contains('hide');}).map(function(t){return t.dataset.app;});}
function show(id,quiet){
  sel=id;var A=APPS[id];document.body.dataset.sel=id;fx.col=A.col;fx.mode=id==='calc'?'dust':'ember';
  tiles.forEach(function(t){var on=t.dataset.app===id;t.classList.toggle('on',on);t.setAttribute('aria-pressed',on);});
  $$('.bg i').forEach(function(i){i.classList.toggle('on',i.dataset.for===id);});
  info.innerHTML='<p class="eyebrow">'+A.k+'</p><h1 class="name">'+A.t+'<small>'+A.s+'</small></h1><p class="desc">'+A.d+'</p>'+
    '<div class="chips">'+A.stats().map(function(x){return '<span class="chip">'+x[0]+' <b>'+x[1]+'</b></span>';}).join('')+'</div>'+
    '<button class="play" id="play">เล่น</button>';
  $('#under').textContent=A.t;
  info.classList.remove('swap');void info.offsetWidth;if(!quiet){info.classList.add('swap');SND.move();}
  $('#play').addEventListener('click',function(e){press(e.currentTarget,launch);});
  bindPress($('#play'));
  try{localStorage.setItem('px5.last',id);}catch(e){}
}
function setCat(c,quiet){cat=c;$$('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.cat===c);});
  tiles.forEach(function(t){t.classList.toggle('hide',c!=='all'&&t.dataset.cat!==c);});
  var v=visible();if(!quiet)SND.tab();if(v.indexOf(sel)<0)show(v[0],true);}
function move(d){var v=visible(),i=v.indexOf(sel),n=Math.max(0,Math.min(v.length-1,i+d));if(n!==i)show(v[n]);}
function moveCat(d){var c=$$('.tab').map(function(t){return t.dataset.cat;}),i=c.indexOf(cat),n=Math.max(0,Math.min(c.length-1,i+d));if(n!==i)setCat(c[n]);}
/* กดแล้วยุบ ปล่อยแล้ววาบขาวและเด้ง */
function bindPress(el){el.addEventListener('pointerdown',function(){el.classList.add('pressing');});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){el.addEventListener(ev,function(){el.classList.remove('pressing');});});}
function press(el,done){if(busy)return;el.classList.remove('pressing');el.classList.remove('fire');void el.offsetWidth;el.classList.add('fire');setTimeout(function(){el.classList.remove('fire');},440);if(done)done(el);}
function launch(){
  if(busy)return;busy=true;var A=APPS[sel],L=$('#launch');SND.ok();
  $('#lart').style.backgroundImage='url(px5/img/'+sel+'-title.webp)';$('#ltxt').textContent='Loading '+A.t;
  try{sessionStorage.setItem('px5.launch',String(Date.now()));}catch(e){}
  setTimeout(function(){L.classList.add('on');},RM?0:260);
  setTimeout(function(){L.classList.add('show');lfx.col=A.col;lfx.mode=sel==='calc'?'dust':'ember';lfx.rate=1.6;lfx.start();lfx.burst(90,$('#lfx').clientWidth/2,$('#lfx').clientHeight/2,9);fx.stop();},RM?0:720);
  setTimeout(function(){location.href=A.href;},RM?200:3300);
}
tiles.forEach(function(t){bindPress(t);t.addEventListener('click',function(){if(t.dataset.app===sel)press(t,launch);else show(t.dataset.app);});});
$$('.tab').forEach(function(t){bindPress(t);t.addEventListener('click',function(){press(t);setCat(t.dataset.cat);});});
var SON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5h3L12 6v12l-4.5-3.5h-3z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4"/></svg>',
    SOFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5h3L12 6v12l-4.5-3.5h-3z"/><path d="m16 10 4 4M20 10l-4 4"/></svg>';
function sndIcon(){$('#snd').innerHTML=SND.on?SON:SOFF;} sndIcon();
function fullscreen(){var d=document,e=d.documentElement;if(d.fullscreenElement){d.exitFullscreen();}else if(e.requestFullscreen){e.requestFullscreen().then(function(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});}).catch(function(){});}}
$('#snd').addEventListener('click',function(){SND.toggle();sndIcon();});
$('#full').addEventListener('click',fullscreen);
addEventListener('keydown',function(e){
  if(!booted){endBoot();return;} if(busy)return;
  if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='q'||e.key==='Q')moveCat(-1);else if(e.key==='e'||e.key==='E')moveCat(1);
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();var t=tiles.filter(function(x){return x.dataset.app===sel;})[0];press(t,launch);}
  else if(e.key==='f'||e.key==='F')fullscreen();
});
/* จอยเกม: ซ้ายขวาเลือก L1 R1 เปลี่ยนหมวด ปุ่มล่างเล่น */
var gpPrev={};(function gp(){var p=(navigator.getGamepads?navigator.getGamepads():[])[0];
  if(p){var b=function(i){return p.buttons[i]&&p.buttons[i].pressed;},ax=p.axes[0]||0,s={l:b(14)||ax<-.6,r:b(15)||ax>.6,a:b(0),l1:b(4),r1:b(5)};
    if(booted&&!busy){if(s.l&&!gpPrev.l)move(-1);if(s.r&&!gpPrev.r)move(1);if(s.l1&&!gpPrev.l1)moveCat(-1);if(s.r1&&!gpPrev.r1)moveCat(1);if(s.a&&!gpPrev.a){var t=tiles.filter(function(x){return x.dataset.app===sel;})[0];press(t,launch);}}
    else if(!booted&&s.a&&!gpPrev.a)endBoot(); gpPrev=s;}
  requestAnimationFrame(gp);})();
function tick(){var d=new Date();$('#clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);} tick();setInterval(tick,10000);

/* ---------- ฉากบูต: โลโก้ ลูกพลังงานสีน้ำเงิน แสงวาบ แล้วสปอตไลต์กับฝุ่นแสง ---------- */
var booted=false,bootRAF=0;
function endBoot(){if(booted)return;booted=true;cancelAnimationFrame(bootRAF);try{sessionStorage.setItem('px5.boot','1');}catch(e){}
  $('#boot').classList.add('out');$('#home').classList.add('in');show(sel,true);fx.rate=.3;fx.start();setTimeout(function(){$('#boot').remove();},1000);}
function boot(){
  var cv=$('#bfx'),c=cv.getContext('2d'),D=Math.min(devicePixelRatio||1,2),W,H;
  function size(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0);} size();addEventListener('resize',size);
  var S=[],Dst=[],i;for(i=0;i<420;i++)S.push({a:Math.random()*6.283,r:Math.pow(Math.random(),1.6),y:(Math.random()-.5)*(Math.random()<.8?.05:.3),sp:Math.random()*.6+.2,z:Math.random()});
  for(i=0;i<170;i++)Dst.push({x:Math.random(),y:Math.random(),r:Math.random()*2.6+.4,v:Math.random()*.012+.003,p:Math.random()*6.28});
  var t0=performance.now();SND.boot();
  function frame(now){var t=(now-t0)/1000,cx=W/2,cy=H/2,R=Math.min(W,H),k,g,j;
    c.globalCompositeOperation='source-over';c.fillStyle='#000';c.fillRect(0,0,W,H);
    if(t>1.7&&t<6.2){ /* ลูกพลังงาน */
      k=Math.min(1,(t-1.7)/1.2)*Math.max(0,Math.min(1,(6.2-t)/.6));c.globalCompositeOperation='lighter';
      g=c.createRadialGradient(cx,cy,0,cx,cy,R*.42);g.addColorStop(0,'rgba(120,150,255,'+.85*k+')');g.addColorStop(.12,'rgba(40,70,255,'+.6*k+')');g.addColorStop(.45,'rgba(10,20,160,'+.22*k+')');g.addColorStop(1,'rgba(0,0,40,0)');
      c.fillStyle=g;c.fillRect(0,0,W,H);
      for(j=0;j<7;j++){var a=t*(.5+j*.13)+j*1.7,rr=R*(.07+.035*Math.sin(t*1.3+j));c.strokeStyle='rgba(90,140,255,'+(.5*k)+')';c.lineWidth=1.5+j*.25;c.beginPath();
        for(var s=0;s<=40;s++){var u=s/40*6.283,wob=1+.45*Math.sin(u*3+a*2+j),x=cx+Math.cos(u+a)*rr*wob*(1+.25*Math.sin(u*2-a)),y=cy+Math.sin(u+a)*rr*wob*.82;s?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();}
      var spread=Math.min(1,(t-2.4)/1.6);if(spread>0)for(j=0;j<S.length;j++){var p=S[j],d=p.r*W*.62*spread,dir=Math.cos(p.a)<0?-1:1,px=cx+dir*d+Math.sin(t*p.sp+p.a)*8,py=cy+p.y*H+Math.sin(t*p.sp*2+p.a)*5*p.z,al=(1-p.r)*k*(.35+.65*p.z);
        c.fillStyle=j%9?'rgba(70,110,255,'+al+')':'rgba(230,235,255,'+al+')';c.fillRect(px,py,1.2+p.z*1.6,1.2+p.z*1.6);}
      if(t>5.2){k=(t-5.2);g=c.createRadialGradient(cx,cy,0,cx,cy,R*.3*k+10);g.addColorStop(0,'rgba(255,190,150,'+Math.min(1,k*1.4)+')');g.addColorStop(1,'rgba(255,120,80,0)');c.fillStyle=g;c.fillRect(0,0,W,H);}
    }
    if(t>=6.0){ /* แสงวาบอุ่น แล้วเหลือสปอตไลต์ */
      var f=Math.max(0,1-(t-6.0)/1.5),sp=Math.min(1,(t-6.3)/1.2);
      c.globalCompositeOperation='source-over';g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgb(18,20,30)');g.addColorStop(1,'rgb(5,7,12)');c.globalAlpha=Math.max(0,sp);c.fillStyle=g;c.fillRect(0,0,W,H);c.globalAlpha=1;
      c.globalCompositeOperation='lighter';
      g=c.createRadialGradient(W*.14,-H*.05,0,W*.14,-H*.05,Math.max(W,H)*.95);g.addColorStop(0,'rgba(255,240,225,'+(.95*sp)+')');g.addColorStop(.1,'rgba(230,205,200,'+(.42*sp)+')');g.addColorStop(.45,'rgba(120,120,160,'+(.1*sp)+')');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
      for(j=0;j<4;j++){c.save();c.translate(W*.14,-H*.05);c.rotate(.5+j*.2+Math.sin(t*.25+j)*.03);g=c.createLinearGradient(0,0,Math.max(W,H),0);g.addColorStop(0,'rgba(255,235,220,'+(.14*sp)+')');g.addColorStop(1,'rgba(255,235,220,0)');c.fillStyle=g;c.fillRect(0,-14-j*9,Math.max(W,H)*1.2,28+j*18);c.restore();}
      for(j=0;j<Dst.length;j++){var q=Dst[j];q.x+=q.v*.06;q.y+=Math.sin(t*.4+q.p)*.0006;if(q.x>1.05)q.x=-.05;var qx=q.x*W,qy=(.42+.5*q.y)*H+Math.sin(t*.5+q.p)*8,qa=sp*(.35+.65*Math.abs(Math.sin(t*.9+q.p)));
        g=c.createRadialGradient(qx,qy,0,qx,qy,q.r*3);g.addColorStop(0,'rgba(255,225,190,'+qa+')');g.addColorStop(1,'rgba(255,200,150,0)');c.fillStyle=g;c.beginPath();c.arc(qx,qy,q.r*3,0,6.283);c.fill();}
      if(f>0){c.fillStyle='rgba(255,225,200,'+f*.9+')';c.fillRect(0,0,W,H);}
      if(t>7.4)$('#press').classList.add('on');
    }
    if(t>11){endBoot();return;}
    bootRAF=requestAnimationFrame(frame);}
  bootRAF=requestAnimationFrame(frame);
  $('#boot').addEventListener('click',function(){SND.unlock();endBoot();});
}
var seen=false;try{seen=sessionStorage.getItem('px5.boot')==='1';}catch(e){}
show(sel,true);
if(seen||RM||/[?&]noboot/.test(location.search)){booted=true;$('#boot').remove();$('#home').classList.add('in');fx.rate=.3;fx.start();}else boot();
addEventListener('pointerdown',function(){SND.unlock();},{once:true});
addEventListener('pageshow',function(e){if(e.persisted){busy=false;var L=$('#launch');L.classList.remove('on','show');lfx.stop();fx.start();show(sel,true);}});
})();
</script>
