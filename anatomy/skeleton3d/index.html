<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>HUMnoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--s1:#0d0d0f;--s2:#151518;--s3:#1d1d21;--line:#26262b;--line2:#34343a;
  --tx:#ececee;--tx2:#a2a2aa;--tx3:#6e6e76;--ac:#ff9f43;--ac2:rgba(255,159,67,.14);--ax:#4aa3ff;--ap:#ff6b6b;
  --hd:56px;--nav:264px;--pn:372px;--r:10px;
  --f:"Inter","IBM Plex Sans Thai",-apple-system,"Sukhumvit Set",system-ui,sans-serif;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);
}
*{box-sizing:border-box}
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;height:100dvh;background:var(--bg);color:var(--tx);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ---------- layout ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--nav) 1fr var(--pn);grid-template-rows:calc(var(--hd) + var(--st)) minmax(0,1fr);grid-template-areas:"hd hd hd" "nav stage panel"}
#hd{grid-area:hd;display:flex;align-items:center;gap:12px;padding:var(--st) calc(16px + var(--sr)) 0 calc(16px + var(--sl));border-bottom:1px solid var(--line);background:var(--s1);z-index:20}
#nav{grid-area:nav;border-right:1px solid var(--line);background:var(--s1);padding:10px 10px calc(24px + var(--sb)) calc(10px + var(--sl));min-height:0}
#stage{grid-area:stage;position:relative;overflow:hidden;background:#000;min-height:0}
#panel{grid-area:panel;border-left:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;min-height:0;z-index:15}

/* ---------- header ---------- */
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font:700 19px/1 Inter,sans-serif;letter-spacing:-.02em}.brand b span{color:var(--ac)}
.brand small{color:var(--tx3);font-size:12px}
#menu{display:flex;width:36px;height:36px;border-radius:8px;align-items:center;justify-content:center;border:1px solid var(--line2);flex:none}
#menu svg{width:18px;height:18px}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
#q{width:100%;height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--s2);color:var(--tx);font:inherit;font-size:16px;padding:0 12px 0 34px;outline:none;-webkit-user-select:text;user-select:text}
@media (min-width:760px){#q{font-size:14px}}
#q:focus{border-color:var(--ac)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--tx3)}
#res{position:absolute;top:42px;left:0;right:0;max-height:60dvh;background:var(--s2);border:1px solid var(--line2);border-radius:var(--r);padding:4px;box-shadow:0 16px 40px rgba(0,0,0,.6);z-index:40}
#res button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px}#res button:hover{background:var(--s3)}
#res small{display:block;color:var(--tx3);font-size:12px}#res p{margin:8px 10px;color:var(--tx3)}
.tools{display:flex;align-items:center;gap:8px}
.tbtn{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:500;text-decoration:none}
.tbtn svg{width:16px;height:16px;flex:none}
.tbtn.on{color:#111;background:var(--ac);border-color:var(--ac)}
.tbtn:disabled{opacity:.35;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;height:36px}
.seg button{padding:0 10px;border-radius:6px;color:var(--tx2);font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.seg .lab{padding:0 8px;color:var(--tx3);font-size:12px;display:flex;align-items:center}

/* ---------- nav ---------- */
.ng{margin-bottom:14px}
.nt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);padding:6px 10px}
.nb{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:42px;padding:8px 12px;border-radius:9px;text-align:left;color:var(--tx2);font-size:14.5px;transition:background .15s,transform .12s}
.nb:active{transform:scale(.97)}
.nb:hover{background:var(--s2);color:var(--tx)}
.nb.on{background:var(--ac2);color:var(--ac)}
.nb small{color:var(--tx3);font-size:11.5px;white-space:nowrap}
.ni.sub .nb{padding-left:24px}
.kids{display:none;padding:2px 0 6px 10px;border-left:1px solid var(--line);margin-left:14px}
.ni.open .kids{display:block}
.kids button{display:block;width:100%;text-align:left;min-height:36px;padding:7px 12px;border-radius:7px;color:var(--tx2);font-size:14px}
.kids button:hover{color:var(--tx)}.kids button.on{color:var(--ac)}

/* ---------- stage ---------- */
#cvs{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;overflow:hidden;font:600 12.5px/1.2 var(--f);color:#111;background:rgba(244,244,246,.95);border:0;padding:5px 10px;border-radius:7px;white-space:nowrap;will-change:transform;animation:lblin .35s both;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.lbl.dim{background:#3a3a40;color:#c9c9cf;opacity:.8}
.lbl.foc{background:var(--ac)!important;color:#1a1006!important;opacity:1}
@keyframes lblin{from{opacity:0}to{opacity:1}}

#crumbs{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;z-index:5;pointer-events:none}
#crumbs>*{pointer-events:auto}
#crumbs button,#crumbs span{position:relative;overflow:hidden;font-size:13.5px;min-height:36px;padding:7px 12px;border-radius:9px;background:#151518;border:1px solid var(--line);color:var(--tx2)}
#crumbs span{color:var(--tx);border-color:var(--line2)}
#crumbs i{color:var(--tx3);font-style:normal}
#crumbs .back{font-size:20px;line-height:1;padding:6px 13px 8px;color:var(--tx);border-color:var(--line2)}
#viewbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sb));display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;background:#151518;border:1px solid var(--line2);z-index:5;max-width:calc(100% - 24px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
#viewbar .vb-x{width:34px;color:var(--tx3);padding:0;justify-content:center}
#viewbar .vb-show{display:none}
#viewbar.hid>*{display:none!important}#viewbar.hid>.vb-show{display:inline-flex!important;color:var(--tx);font-weight:600;font-size:13px}
#viewbar.hid{padding:3px}
#focusBtn{flex:none}#focusBtn.on{background:var(--ac);color:#111;border-color:var(--ac)}
@media (max-width:759px){#focusBtn .tx{display:none}#focusBtn{padding:0 9px}}
#viewbar .vb-t{font-size:11px;color:var(--tx3);padding:0 8px 0 6px;white-space:nowrap}
#viewbar button{position:relative;overflow:hidden;min-height:40px;padding:0 13px;border-radius:9px;font-size:14px;font-weight:500;color:var(--tx);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:transform .12s,background .15s}
#viewbar button svg{width:15px;height:15px}
#viewbar button:active{transform:scale(.93);background:var(--s3)}
#viewbar button:hover{background:var(--s3);color:var(--tx)}
#viewbar .sep{width:1px;background:var(--line2);margin:4px 2px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:13px;transition:opacity .35s;background:#000}
#loading.done{opacity:0;pointer-events:none}

/* ---------- tool dock ---------- */
#dock{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:8px 6px;border-radius:16px;background:#151518;border:1px solid var(--line2);z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.dk-top{display:flex;align-items:center;gap:2px}
.dk-grip{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;cursor:grab;touch-action:none;border-radius:8px}
.dk-grip i{display:block;width:26px;height:3px;border-radius:2px;background:var(--line2)}
.dk-grip span{font-size:10px;font-weight:600;color:var(--tx3);margin-top:1px}
.dk-grip:active,#dock.drag .dk-grip{background:var(--s3);cursor:grabbing}
.dk-x{width:22px;height:30px;border-radius:7px;color:var(--tx3);display:flex;align-items:center;justify-content:center}.dk-x svg{width:14px;height:14px}.dk-x:active{background:var(--s3)}
#dock.drag{box-shadow:0 16px 40px rgba(0,0,0,.7);border-color:var(--ac)}
#dock{transition:width .2s,padding .2s}
.dk-show{display:none}
#dock.hid{padding:4px}#dock.hid>.dk,#dock.hid .dk-top{display:none}
#dock.hid .dk-show{display:flex;flex-direction:column;align-items:center;gap:2px;width:52px;padding:8px 0;border-radius:10px;color:var(--tx);font-size:11px;font-weight:600}
#dock.hid .dk-show svg{width:18px;height:18px;color:var(--ac)}
.cswitch{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--s2);border:1px solid var(--line);margin-bottom:10px}
.cswitch button{flex:1;min-height:36px;border-radius:7px;font-size:13px;font-weight:600;color:var(--tx2)}
.cswitch button.on{background:var(--ac);color:#1a1006}
body.navhide #app{grid-template-columns:0 1fr var(--pn)}body.navhide #nav{visibility:hidden;border:0;padding:0}
#app{transition:grid-template-columns .25s}
.dk{position:relative;overflow:hidden;width:72px;min-height:68px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tx);border:1px solid transparent;transition:transform .14s cubic-bezier(.3,.7,.4,1.4),background .2s,border-color .2s,color .2s}
.dk svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.3,.7,.4,1.5)}
.dk span{font-size:13px;font-weight:600;line-height:1.2}
.dk small{font-size:10.5px;color:var(--tx3);line-height:1.2;max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk:active{transform:scale(.9)}
.dk.on{background:var(--ac2);border-color:rgba(255,159,67,.55);color:var(--ac)}
.dk.on small{color:#ffc48a}
.dk.on svg{transform:scale(1.08)}
.dk.na{opacity:.45}
#tBook{background:#1d1a16;border-color:#3b3226}
/* toast */
#toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-10px);opacity:0;pointer-events:none;z-index:8;background:#1c1c20;border:1px solid var(--line2);border-left:3px solid var(--ac);border-radius:10px;padding:9px 14px;max-width:min(440px,calc(100% - 32px));box-shadow:0 12px 30px rgba(0,0,0,.6);transition:opacity .2s,transform .25s cubic-bezier(.3,.7,.4,1.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{display:block;font-size:14px}#toast span{display:block;font-size:12.5px;color:var(--tx2)}
/* ripple + press */
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.press{position:relative;overflow:hidden;transition:transform .12s}.press:active{transform:scale(.95)}

/* ---------- panel ---------- */
#grab{display:none}
#pbody{flex:1;min-height:0;padding:20px 20px calc(24px + var(--sb));-webkit-user-select:text;user-select:text}
#pbody.enter>*{animation:pin .32s both}#pbody.enter>*:nth-child(2){animation-delay:.03s}#pbody.enter>*:nth-child(3){animation-delay:.06s}#pbody.enter>*:nth-child(n+4){animation-delay:.09s}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#pbody header{margin-bottom:12px}
.kicker{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
#pbody h2{margin:4px 0 2px;font:600 22px/1.25 var(--f);letter-spacing:-.01em}
.th{margin:0;color:var(--tx2)}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.facts span{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2)}
.facts b{color:var(--tx)}.facts .ax{color:var(--ax);border-color:rgba(74,163,255,.4)}.facts .ap{color:var(--ap);border-color:rgba(255,107,107,.4)}
.bookcard{display:flex;gap:12px;margin:14px 0 6px;padding:12px;border-radius:12px;background:linear-gradient(180deg,#1d1914,#16130f);border:1px solid #3b3226}
.bc-ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--ac2);color:var(--ac);display:flex;align-items:center;justify-content:center}.bc-ic svg{width:22px;height:22px}
.bc-tx b{font-size:14.5px}.bc-tx p{margin:2px 0 8px!important;font-size:13px;color:var(--tx2)}.bc-tx strong{color:var(--tx);font-weight:600}
.bc-pg{display:flex;flex-wrap:wrap;gap:6px}
.pg{font-size:14px;font-weight:600;min-height:38px;padding:0 14px;border-radius:9px;background:var(--ac);color:#1a1006;border:0}
#pbody section{padding:14px 0;border-top:1px solid var(--line)}
#pbody section:first-of-type{margin-top:8px}
#pbody h4{margin:0 0 8px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
#pbody p{margin:0 0 6px}#pbody ul{margin:0;padding-left:18px}#pbody li{margin:3px 0}
.parts{list-style:none;margin:0;padding:0;counter-reset:p}
.parts li{margin:0!important;counter-increment:p}
.parts button{position:relative;overflow:hidden;display:grid;grid-template-columns:22px 1fr;column-gap:6px;width:100%;text-align:left;padding:9px 8px;border-radius:8px;transition:background .15s}
.parts button::before{content:counter(p);grid-row:span 2;font-size:11px;color:var(--tx3);padding-top:2px}
.parts button:hover{background:var(--s2)}.parts button.foc{background:var(--ac2)}.parts button.foc b{color:var(--ac)}
.parts b{font-weight:600}.parts span{color:var(--tx2);font-size:13px}
.con{list-style:none;padding:0!important}.con li{padding:6px 0;border-bottom:1px dashed var(--line)}.con li:last-child{border:0}
.con a{color:var(--tx);font-weight:600;text-decoration:none;border-bottom:1px solid var(--ac)}
.con em{font-style:normal;font-size:12px;color:var(--ac);margin:0 6px;padding:1px 6px;border-radius:5px;background:var(--ac2)}
.tip{background:var(--ac2);border-left:3px solid var(--ac);padding:8px 10px;border-radius:0 7px 7px 0;color:#ffd9b3}
.note{font-size:13px;color:var(--tx2);background:var(--s2);border:1px solid var(--line);padding:8px 10px;border-radius:8px;margin:10px 0}
.wide{width:100%;min-height:44px;padding:9px;border-radius:10px;border:1px solid var(--line2);font-weight:600;margin:8px 0;color:var(--tx);background:var(--s2)}
.wide.on{background:var(--ac);border-color:var(--ac);color:#111}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{position:relative;overflow:hidden;font-size:14px;min-height:38px;padding:7px 13px;border-radius:9px;border:1px solid var(--line2);color:var(--tx);background:var(--s2);transition:transform .12s}
.chips button:active{transform:scale(.95)}
.chips button:hover{color:var(--tx);border-color:var(--tx3)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.legend button{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;min-height:34px;padding:6px 8px;border-radius:7px;text-align:left;font-size:13px;color:var(--tx2)}
.legend button.foc{background:var(--ac2);color:var(--ac)}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.seg.side{margin:8px 0}
.prose table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}.prose th{color:var(--tx3);font-weight:600;font-size:12px}
#pbody footer{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--tx3)}

/* ---------- notebook ---------- */
#book{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.96);display:flex;flex-direction:column}
#book.in{animation:bin .28s cubic-bezier(.2,.8,.3,1) both}#book.out{animation:bin .2s reverse both}
@keyframes bin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#book .bt{margin-right:auto;display:flex;flex-direction:column;min-width:0}#bfor{font-size:12.5px;color:var(--ac)}
#book .tbtn{min-width:44px;height:40px;font-size:15px;color:var(--tx)}#book .close{background:var(--s3)}
#book[hidden]{display:none}
#book .bar{display:flex;align-items:center;gap:6px;padding:calc(10px + var(--st)) 12px 10px;border-bottom:1px solid var(--line);background:var(--s1);flex-wrap:wrap}
#book .bar b{font-weight:600}
#bnum{font-size:13px;color:var(--tx2);min-width:84px;text-align:center}
#bscroll{flex:1;overflow:auto;touch-action:pan-x pan-y;text-align:center;padding:16px 12px calc(16px + var(--sb))}
#bimg{max-width:none;width:100%;border-radius:6px;background:#fff}
@media (min-width:900px){#bimg{width:min(100%,820px)}}

/* ---------- responsive ---------- */
#scrim{display:none}
@media (max-width:1099px){
  #app{grid-template-columns:1fr var(--pn);grid-template-areas:"hd hd" "stage panel"}
  #menu{display:flex}
  #nav{position:fixed;top:calc(var(--hd) + var(--st));left:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .25s;z-index:30;box-shadow:12px 0 40px rgba(0,0,0,.5)}
  body.navopen #nav{transform:none}
  #scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.5)}
  body.navopen #scrim{display:block}
  .brand small{display:none}
}
@media (max-width:899px){ :root{--pn:320px} #viewbar .vb-t{display:none} #viewbar button{padding:0 10px} }
@media (max-width:759px){
  :root{--hd:56px}
  .lbl{font-size:11.5px;padding:4px 7px}
  #dock{top:auto;bottom:calc(30dvh + 66px);transform:none;right:8px;padding:6px 4px}.dk{width:60px;min-height:58px}.dk span{font-size:12px}.dk svg{width:21px;height:21px}.dk-t{display:none}
  #app{grid-template-columns:1fr;grid-template-areas:"hd" "stage"}
  #hd{gap:8px}.brand b{font-size:17px}
  .search{max-width:none}
  #panel{position:fixed;left:0;right:0;bottom:0;height:30dvh;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;transition:height .25s;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
  #panel.drag{transition:none}
  #grab{display:flex;justify-content:center;align-items:center;height:22px;flex:none;touch-action:none;cursor:grab}
  #grab i{width:40px;height:4px;border-radius:2px;background:var(--line2)}
  #pbody{padding-top:4px}
  #viewbar{bottom:calc(30dvh + 10px)}
  #viewbar button{padding:6px 8px}
  #viewbar .opt{display:none}
  #book .bt{display:none}
}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>

<body>
<div id="app">
  <header id="hd">
