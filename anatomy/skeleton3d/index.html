<style>
:root{--ac:#ff9f43;--gl:rgba(20,20,20,.7);--bd:rgba(255,255,255,.12);--tx:#f2f2f2;--mu:#9a9a9a;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}

#c{position:fixed;inset:0}

#body ul{margin:0;padding-left:18px}#body li{margin:2px 0}
#body .kv{display:flex;gap:8px;margin:3px 0}#body .kv b{color:var(--mu);font-weight:500;min-width:92px}
#body a{color:var(--ac);text-decoration:none}
.tip{background:rgba(255,159,67,.12);border-left:3px solid var(--ac);padding:6px 10px;border-radius:6px;margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font-size:13px}
@media (max-width:767px){#panel{left:0;right:0;bottom:0;height:22dvh;border-radius:18px 18px 0 0;transition:height .25s}#panel.drag{transition:none}#hide{display:none}}
@media (min-width:768px){#top{right:calc(env(safe-area-inset-right) + 396px)}#panel{top:calc(var(--st) + 8px);right:calc(env(safe-area-inset-right) + 8px);bottom:calc(var(--sb) + 8px);width:380px;transition:transform .25s}#panel.hid{transform:translateX(400px)}#handle{display:none}body.ph #top{right:8px}#hide{position:absolute;left:-44px;top:50%;width:36px;height:56px;padding:0}#panel.hid #hide{left:-52px}}

#stat b{color:var(--tx)}
@media (max-width:767px){#stat{bottom:calc(22dvh + 8px)}}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);padding:12px 18px;font-size:16px;display:none;z-index:9}
.lbl{font-size:11px;color:#fff;background:rgba(0,0,0,.65);border:1px solid rgba(255,159,67,.6);padding:1px 6px;border-radius:6px;white-space:nowrap;pointer-events:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);pointer-events:none}

$('#hide').onclick=()=>{const h=panel.classList.toggle('hid');document.body.classList.toggle('ph',h);$('#hide').textContent=h?'‹':'›';setTimeout(()=>{viewOff();if(!state.key&&!state.rk)fit(false)},280)};
addEventListener('resize',()=>{if(innerWidth>=768)panel.style.height='';else setLv(+panel.dataset.lv)});
['pointerdown','touchstart','touchmove','wheel'].forEach(t=>[panel,$('#top'),$('#views')].forEach(el=>el.addEventListener(t,e=>e.stopPropagation(),{passive:true})));

// lock screen gestures
document.addEventListener('touchmove',e=>{if(!e.target.closest('#body,#res,#row2'))e.preventDefault()},{passive:false});
['gesturestart','gesturechange','gestureend','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));

/* ============ loop ============ */
window.__dbg=()=>({miss:DATA.filter(d=>!meshes.some(m=>m.userData.id===d.id)).map(d=>d.id),unm:meshes.filter(m=>!m.userData.id).map(m=>m.name),cam:cam.position.toArray(),t:ctl.target.toArray(),n:meshes.length,f:free(),b:root&&new THREE.Box3().setFromObject(root)});
R.setAnimationLoop(()=>{if(tw){let k=Math.min(1,(performance.now()-tw.t0)/650);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  ctl.target.lerpVectors(tw.ft,tw.t,k);cam.position.lerpVectors(tw.fp,tw.p,k);if(k>=1)tw=null}
  ctl.update();R.render(scene,cam);L2.render(scene,cam)});
</script>
